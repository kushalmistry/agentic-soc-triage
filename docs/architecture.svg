<svg xmlns="http://www.w3.org/2000/svg" width="680" height="580" viewBox="0 0 680 580" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t { font-size:14px; font-weight:500; }
      .s { font-size:12px; }
      .ln { stroke:#73726c; stroke-width:1.5; fill:none; }
    </style>
  </defs>

  <!-- sources -->
  <g>
    <rect x="50" y="30" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text class="t" x="140" y="54" text-anchor="middle" fill="#0C447C">Endpoint</text>
    <text class="s" x="140" y="72" text-anchor="middle" fill="#185FA5">EPP sensor</text>
  </g>
  <g>
    <rect x="250" y="30" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text class="t" x="340" y="54" text-anchor="middle" fill="#0C447C">Identity</text>
    <text class="s" x="340" y="72" text-anchor="middle" fill="#185FA5">IDP sign-ins</text>
  </g>
  <g>
    <rect x="450" y="30" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text class="t" x="540" y="54" text-anchor="middle" fill="#0C447C">Cloud</text>
    <text class="s" x="540" y="72" text-anchor="middle" fill="#185FA5">CSPM / CDR</text>
  </g>
  <line x1="140" y1="86" x2="300" y2="118" class="ln" marker-end="url(#arrow)"/>
  <line x1="340" y1="86" x2="340" y2="118" class="ln" marker-end="url(#arrow)"/>
  <line x1="540" y1="86" x2="380" y2="118" class="ln" marker-end="url(#arrow)"/>

  <!-- gate 1 -->
  <rect x="200" y="122" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="t" x="340" y="146" text-anchor="middle" fill="#085041">Gate 1: severity filter</text>
  <text class="s" x="340" y="164" text-anchor="middle" fill="#0F6E56">High and above only</text>
  <line x1="340" y1="178" x2="340" y2="208" class="ln" marker-end="url(#arrow)"/>

  <!-- agent -->
  <rect x="200" y="212" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="t" x="340" y="236" text-anchor="middle" fill="#3C3489">Agent: judgment call</text>
  <text class="s" x="340" y="254" text-anchor="middle" fill="#534AB7">Returns strict JSON</text>
  <line x1="340" y1="268" x2="340" y2="298" class="ln" marker-end="url(#arrow)"/>

  <!-- gate 2 -->
  <rect x="200" y="302" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="t" x="340" y="326" text-anchor="middle" fill="#085041">Gate 2: validate + safety</text>
  <text class="s" x="340" y="344" text-anchor="middle" fill="#0F6E56">Schema, confidence, scope</text>
  <path d="M340 358 L340 382 L200 382 L200 406" class="ln" marker-end="url(#arrow)"/>
  <path d="M340 382 L480 382 L480 406" class="ln" marker-end="url(#arrow)"/>

  <!-- action / escalate -->
  <rect x="100" y="410" width="200" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text class="t" x="200" y="434" text-anchor="middle" fill="#27500A">Take action</text>
  <text class="s" x="200" y="452" text-anchor="middle" fill="#3B6D11">host, user, or key</text>
  <rect x="380" y="410" width="200" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text class="t" x="480" y="434" text-anchor="middle" fill="#633806">Escalate to human</text>
  <text class="s" x="480" y="452" text-anchor="middle" fill="#854F0B">Fail safe</text>
  <path d="M200 466 L200 490 L300 490 L300 504" class="ln" marker-end="url(#arrow)"/>
  <path d="M480 466 L480 490 L380 490 L380 504" class="ln" marker-end="url(#arrow)"/>

  <!-- case -->
  <rect x="200" y="508" width="280" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="t" x="340" y="534" text-anchor="middle" fill="#2C2C2A">Audit case on every path</text>
</svg>
